<svg xmlns="http://www.w3.org/2000/svg" width="660" height="335" viewBox="0 0 660 335"><rect width="660" height="335" fill="white"/><text x="330" y="25.3" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1F2328" font-style="italic"><tspan dy="0">Control (Sections 6–10): both reach the same V</tspan><tspan dy="-6" font-size="10.8">*</tspan><tspan dy="6"> and π</tspan><tspan dy="-6" font-size="10.8">*</tspan><tspan dy="6"> </tspan></text><rect x="25" y="42" width="290" height="66" rx="10" fill="#FFF1E5" stroke="#D9822B" stroke-width="1.6"/><text x="170" y="71.2" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#1F2328"><tspan dy="0">Layer 3a: Policy Iteration</tspan></text><text x="170" y="88.9" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#1F2328"><tspan dy="0">full evaluation + greedy improvement</tspan></text><rect x="345" y="42" width="290" height="66" rx="10" fill="#FFF1E5" stroke="#D9822B" stroke-width="1.6"/><text x="490" y="71.2" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#1F2328"><tspan dy="0">Layer 3b: Value Iteration</tspan></text><text x="490" y="88.9" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#1F2328"><tspan dy="0">one sweep of evaluation + max</tspan></text><text x="330" y="80.6" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#D9822B" font-weight="bold"><tspan dy="0">GPI</tspan></text><rect x="20" y="152" width="620" height="66" rx="10" fill="#DDF4FF" stroke="#0969DA" stroke-width="1.6"/><text x="330" y="181.2" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#1F2328"><tspan dy="0">Layer 2: Prediction (Sections 4–5)</tspan></text><text x="330" y="198.9" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#1F2328"><tspan dy="0">Iterative Policy Evaluation  v</tspan><tspan dy="4.35" font-size="10.4">k+1</tspan><tspan dy="-4.35"> = r</tspan><tspan dy="-5.80" font-size="10.4">π</tspan><tspan dy="5.8"> + γP</tspan><tspan dy="-5.80" font-size="10.4">π</tspan><tspan dy="5.8">v</tspan><tspan dy="4.35" font-size="10.4">k</tspan><tspan dy="-4.35">  grades a frozen policy π</tspan></text><rect x="20" y="262" width="620" height="66" rx="10" fill="#F6F8FA" stroke="#57606A" stroke-width="1.6"/><text x="330" y="291.2" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#1F2328"><tspan dy="0">Layer 1: Contraction Engine (Sections 2–3)</tspan></text><text x="330" y="308.9" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#1F2328"><tspan dy="0">γ &lt; 1 ⟹ T</tspan><tspan dy="-5.80" font-size="10.4">π</tspan><tspan dy="5.8"> and T</tspan><tspan dy="-5.800000000000001" font-size="10.4">*</tspan><tspan dy="5.800000000000001"> are γ-contractions, so V</tspan><tspan dy="4.35" font-size="10.4">k+1</tspan><tspan dy="-4.35"> ← T(V</tspan><tspan dy="4.35" font-size="10.4">k</tspan><tspan dy="-4.35">) converges from any guess</tspan></text><line x1="330" y1="262" x2="330" y2="218" stroke="#57606A" stroke-width="2.2"/><polygon points="330,218 334.1,226.0 325.9,226.0" fill="#57606A"/><line x1="170" y1="152" x2="170" y2="108" stroke="#57606A" stroke-width="2.2"/><polygon points="170,108 174.1,116.0 165.9,116.0" fill="#57606A"/><line x1="490" y1="152" x2="490" y2="108" stroke="#57606A" stroke-width="2.2"/><polygon points="490,108 494.1,116.0 485.9,116.0" fill="#57606A"/></svg>