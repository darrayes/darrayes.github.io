<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410"><rect width="640" height="410" fill="white"/><rect x="15" y="38" width="120" height="64" rx="10" fill="#F6F8FA" stroke="#57606A" stroke-width="1.6"/><text x="75" y="66.1" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1F2328"><tspan dy="0">Start:</tspan></text><text x="75" y="84.4" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1F2328"><tspan dy="0">any policy π</tspan><tspan dy="4.5" font-size="10.8">0</tspan><tspan dy="-4.5"> </tspan></text><rect x="180" y="34" width="220" height="72" rx="10" fill="#DDF4FF" stroke="#0969DA" stroke-width="1.6"/><text x="290" y="66.1" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1F2328"><tspan dy="0">1. Policy Evaluation</tspan></text><text x="290" y="84.4" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1F2328"><tspan dy="0">compute V</tspan><tspan dy="-6.00" font-size="10.8">πm</tspan><tspan dy="6"> (many sweeps)</tspan></text><rect x="180" y="204" width="220" height="72" rx="10" fill="#FFF1E5" stroke="#D9822B" stroke-width="1.6"/><text x="290" y="236.1" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1F2328"><tspan dy="0">2. Policy Improvement</tspan></text><text x="290" y="254.4" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1F2328"><tspan dy="0">π</tspan><tspan dy="4.5" font-size="10.8">m+1</tspan><tspan dy="-4.5"> = greedy(V</tspan><tspan dy="-6.00" font-size="10.8">πm</tspan><tspan dy="6">)</tspan></text><rect x="450" y="208" width="140" height="64" rx="10" fill="white" stroke="#1F2328" stroke-width="1.6"/><text x="520" y="236.1" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1F2328"><tspan dy="0">policy</tspan></text><text x="520" y="254.4" font-family="Calibri, Carlito, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1F2328"><tspan dy="0">unchanged?</tspan></text><rect x="450" y="335" width="140" height="60" rx="10" fill="#DAFBE1" stroke="#1A7F37" stroke-width="1.6"/><text x="520" y="370.6" font-family="Calibri, Carlito, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1F2328" font-weight="bold"><tspan dy="0">Return π</tspan><tspan dy="-6.4" font-size="11.5">*</tspan><tspan dy="6.4">, V</tspan><tspan dy="-6.4" font-size="11.5">*</tspan><tspan dy="6.4"> </tspan></text><line x1="135" y1="70" x2="178" y2="70" stroke="#57606A" stroke-width="1.8"/><polygon points="178,70 170.0,74.1 170.0,65.9" fill="#57606A"/><line x1="290" y1="106" x2="290" y2="202" stroke="#0969DA" stroke-width="1.8"/><polygon points="290,202 285.9,194.0 294.1,194.0" fill="#0969DA"/><line x1="400" y1="240" x2="448" y2="240" stroke="#D9822B" stroke-width="1.8"/><polygon points="448,240 440.0,244.1 440.0,235.9" fill="#D9822B"/><line x1="520" y1="272" x2="520" y2="333" stroke="#1A7F37" stroke-width="1.8"/><polygon points="520,333 515.9,325.0 524.1,325.0" fill="#1A7F37"/><text x="532" y="306.9" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" text-anchor="start" fill="#1A7F37" font-weight="bold"><tspan dy="0">yes</tspan></text><line x1="520" y1="208" x2="520" y2="70" stroke="#CF222E" stroke-width="1.8"/><line x1="520" y1="70" x2="402" y2="70" stroke="#CF222E" stroke-width="1.8"/><polygon points="402,70 410.0,65.9 410.0,74.1" fill="#CF222E"/><text x="532" y="136.4" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" text-anchor="start" fill="#CF222E" font-weight="bold"><tspan dy="0">no:</tspan></text><text x="532" y="153.4" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" text-anchor="start" fill="#CF222E" font-weight="bold"><tspan dy="0">m ← m + 1</tspan></text><text x="250" y="352.8" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1F2328" font-style="italic"><tspan dy="0">Drone trace:</tspan></text><text x="250" y="369.9" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1F2328" font-style="italic"><tspan dy="0">π</tspan><tspan dy="4.2" font-size="10.1">0</tspan><tspan dy="-4.2"> = [R, R, R] → π</tspan><tspan dy="4.2" font-size="10.1">1</tspan><tspan dy="-4.2"> = [D, D, R]</tspan></text><text x="250" y="387.0" font-family="Calibri, Carlito, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1F2328" font-style="italic"><tspan dy="0">→ π</tspan><tspan dy="4.2" font-size="10.1">2</tspan><tspan dy="-4.2"> = [D, R, R] (stable)</tspan></text></svg>